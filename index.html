<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piket & Struktur Kelas - XI DKV 3</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

    <!-- Header / Navbar -->
    <header class="header">

            <div class="logo-badge"><i class="fa-solid fa-graduation-cap"></i></div>
            <div>
                <h1>XI DKV 3</h1>
                <p>Sistem Informasi Kelas & Piket</p>

    <!-- Main Content Container -->
    <main class="main-container">

        <section class="banner-card">
            <div class="banner-content">
                <span class="badge-status" id="dayBadge">Hari Ini</span>
                <h2 id="todayTitle">Memuat Jadwal Piket...</h2>
                <p id="todayDesc">Pastikan kelompok piket hari ini bertugas dengan penuh tanggung jawab ya! 🧹✨</p>
            </div>
            <div class="banner-illustration">
                <i class="fa-solid fa-broom-ball"></i>
            </div>
        </section>

        <!-- Grid Layout Utama -->
        <div class="grid-layout">
